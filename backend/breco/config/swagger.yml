openapi: "3.0.0"
info:
  title: Breco API
  description: |
    REST API for the Breco carpooling app.
    Manage users, trips and carpooling places in Brittany, France.
  version: 2.0.0
  contact:
    name: Breco support
    email: syl@djro.fr
  license:
    name: MIT license
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8081
    description: Local development - Nginx reverse proxy
  - url: http://37.59.101.232:8081
    description: VPS production - Nginx reverse proxy

tags:
  - name: Auth
    description: Authentication endpoints (registration, login, verification)
  - name: Users
    description: User management
  - name: Towns
    description: Management of Breton cities
  - name: Locations
    description: Management of carpooling places

paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Exception:
      type: object
      properties:
        code:
          type: integer
          example: 500
        url:
          type: string
          example: /url/path
        message:
          type: string
          example: Internal Error
      xml:
        name: response
    OperationResult:
      type: object
      properties:
        result:
          type: boolean
      xml:
        name: response
x-swagger-bake:
  components:
    schemas:
      Generic-Collection:
        type: object
        x-data-element: data
        properties:
          collection:
            type: object
            properties:
              url:
                type: string
                format: url
                example: /index
              count:
                type: integer
                example: 20
              total:
                type: integer
                example: 200
              pages:
                type: integer
                example: 10
              next:
                type: string
                format: url
                example: /index?page=:number
              prev:
                type: string
                format: url
                example: /index?page=:number
              first:
                type: string
                format: url
                example: /index
              last:
                type: string
                format: url
                example: /index?page=:number
