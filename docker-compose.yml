# docker-compose.yml
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: breco_mysql
    networks:
      - breco_network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"  # Expose MySQL on host port 3307 instead of default 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend CakePHP
  backend:
    image: ${DOCKER_USERNAME}/breco-backend:latest
    build:
      context: ./backend/breco
      dockerfile: Dockerfile-backend
    container_name: breco_backend
    environment:
      DOCKER_ENV: "true"
      DEBUG: "false"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DB}"
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_FROM: noreply@breco.fr
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
    ports:
      - "8765:9000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - breco_network

  # Nginx (Reverse Proxy for Backend)
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: breco_nginx
    ports:
      - "8081:80"    # Expose Nginx on host port 8081 instead of default 80    
    volumes:
      - ./backend/breco/webroot:/app/webroot 
    networks:
      - breco_network
    depends_on:
      - backend

  # Frontend Vue 3
  frontend:
    image: ${DOCKER_USERNAME}/breco-frontend:latest
    build:
      context: ./frontend/breco
      dockerfile: Dockerfile-frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: breco_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL} # e.g., http://localhost:8081/api
    ports:
      - "3001:80"    # Expose Frontend on host port 3001 instead of default 80
    depends_on:
      - backend
    networks:
      - breco_network

  # MailHog - Email testing tool
  mailhog:
    image: mailhog/mailhog:latest
    container_name: breco_mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - breco_network

  # SonarQube - Code quality analysis
  sonarqube:
    image: sonarqube:26.3.0.120487-community
    container_name: breco_sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    depends_on:
      - sonarqube-db
    networks:
      - breco_network

  # SonarQube Database
  sonarqube-db:
    image: postgres:15-alpine
    container_name: breco_sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    networks:
      - breco_network

  # Jenkins CI/CD
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile-jenkins
    image: breco-jenkins:2.541.3
    container_name: breco-jenkins
    privileged: true
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - breco_network

volumes:
  mysql_data:
  sonarqube_db:
  jenkins-data:
networks:
  breco_network:
    driver: bridge