version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: breco_mysql
    networks:
      - breco_network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"  # Expose MySQL on host port 3307 instead of default 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend CakePHP
  backend:
    image: ${DOCKER_USERNAME}/breco-backend:latest
    container_name: breco_backend
    environment:
      DEBUG: "false"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DB}"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8765:9000"
    volumes:
      - ./backend/breco/src:/app/src
      - ./backend/breco/config:/app/config
      - ./backend/breco/webroot:/app/webroot
      - ./backend/breco/bin:/app/bin
      - ./backend/breco/templates:/app/templates
      - ./backend/breco/resources:/app/resources
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - breco_network

  # Nginx (Reverse Proxy for Backend)
  nginx:
    image: nginx:alpine
    container_name: breco_nginx
    ports:
      - "8081:80"    # Expose Nginx on host port 8081 instead of default 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/breco/webroot:/app/webroot:ro
    depends_on:
      - backend
    networks:
      - breco_network

  # Frontend Vue 3
  frontend:
    image: ${DOCKER_USERNAME}/breco-frontend:latest
    container_name: breco_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL} # e.g., http://localhost:8081/api
    ports:
      - "3001:3000"    # Expose Frontend on host port 3001 instead of default 3000
    depends_on:
      - backend
    networks:
      - breco_network

volumes:
  mysql_data:

networks:
  breco_network:
    driver: bridge