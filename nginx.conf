user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # CORS origin mapping
    map $http_origin $cors_origin {
        "~^http://localhost:3001$" $http_origin;
        "~^http://localhost:8081$" $http_origin;
        "~^http://37.59.101.232:3001$" $http_origin;
        "~^http://37.59.101.232:8081$" $http_origin;
        default "";
    }

    # FastCGI upstream for PHP-FPM
    upstream backend_fpm {
        server backend:9000;
    }

    server {
        listen 80;
        server_name _;

        # Logs
        access_log /var/log/nginx/breco_access.log main;
        error_log /var/log/nginx/breco_error.log warn;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # CORS Headers (for all requests)
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # API requests → Backend via FastCGI
        location /api/ {
            rewrite ^/api(/.*)$ $1 break; 
            fastcgi_pass backend_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /app/webroot/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include fastcgi_params;
            
            # FastCGI settings
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            fastcgi_pass backend_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /app/webroot/index.php;
            fastcgi_param REQUEST_URI /health;
            include fastcgi_params;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }
}